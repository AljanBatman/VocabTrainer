<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocab Trainer</title>
<style>
:root{--bg:#f2f4f7;--surface:#fff;--ink:#14213d;--muted:#5b6578;--line:#d5dae3;--hl:#ffd84d;--hlink:#14213d;--ok:#1f7a4d;--okbg:#dff3e8;--bad:#b3261e;--badbg:#fbe3e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--surface:#182137;--ink:#eef1f7;--muted:#9aa5bb;--line:#2b3550;--hl:#ffd84d;--hlink:#14213d;--ok:#7fe0a9;--okbg:#17382a;--bad:#ff9a92;--badbg:#411c1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1624;--surface:#182137;--ink:#eef1f7;--muted:#9aa5bb;--line:#2b3550;--ok:#7fe0a9;--okbg:#17382a;--bad:#ff9a92;--badbg:#411c1a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,"Iowan Old Style","Palatino Linotype",serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button{font:inherit;cursor:pointer;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 16px;min-height:44px}
button:focus-visible,input:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
button.on{background:var(--ink);color:var(--bg)}
button.pri{background:var(--hl);color:var(--hlink);border-color:var(--hlink);font-weight:bold}
.lv button{min-width:64px;font-weight:bold}
.mode button{flex:1;border-color:var(--line)}
.mode button.on{border-color:var(--ink)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 6px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:12px}
.card{background:var(--surface);border:1.5px solid var(--ink);border-radius:16px;padding:28px 22px;min-height:250px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}
.word{font-size:38px;font-weight:bold;margin:0}
.word mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit}
.pos{color:var(--muted);font-style:italic;margin:2px 0 0}
.def{font-size:20px;margin:10px 0}
.ex{color:var(--muted);font-style:italic;margin:6px 0 0}
.hint{color:var(--muted);font-size:14px;margin-top:14px}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{flex:1}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;border-color:var(--line);background:var(--surface)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.q{background:var(--surface);border:1.5px solid var(--ink);border-radius:16px;padding:22px;margin-bottom:12px}
.q p{margin:0 0 6px}
input[type=text]{width:100%;font:inherit;font-size:22px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:10px}
.fb{padding:10px 12px;border-radius:10px;margin-top:10px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.no{background:var(--badbg);color:var(--bad)}
.score{font-size:56px;font-weight:bold;margin:6px 0}
.miss{text-align:left;margin:14px 0 0;padding:0;list-style:none}
.miss li{padding:8px 0;border-top:1px solid var(--line)}
.foot{color:var(--muted);font-size:13px;margin-top:24px;text-align:center}
.foot button{font-size:13px;min-height:36px;padding:4px 10px;border-color:var(--line);color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<h1>Vocab Trainer</h1>
<p class="sub">Learn the words, then test yourself. Your progress is saved on this device.</p>
<div class="row lv" id="lv"></div>
<div class="row mode" id="md"></div>
<div id="app"></div>
<p class="foot"><button onclick="resetLvl()">Reset progress for this level</button></p>
</main>
<script>
// word, part of speech, meaning, example (example uses the exact word so it can be blanked)
var D={
a2:[
["borrow","verb","to take something and give it back later","Can I borrow your pen for a minute?"],
["luggage","noun","bags and cases you take when you travel","She packed her luggage the night before."],
["review","noun","an opinion about a film, book, or product","I read a good review before I bought it."],
["improve","verb","to get better or make something better","I want to improve my speaking."],
["invite","verb","to ask someone to come to an event","They invite everyone to the party."],
["empty","adjective","with nothing inside","The fridge is empty again."],
["crowded","adjective","full of people","The metro was very crowded this morning."],
["delay","noun","a time when something happens later than planned","There was a long delay at the airport."],
["comfortable","adjective","pleasant to wear, sit on, or be in","This chair is really comfortable."],
["repair","verb","to fix something that is broken","He can repair old phones."]],
b1:[
["achieve","verb","to succeed in doing something, usually with effort","She worked hard to achieve her goal."],
["opportunity","noun","a chance to do something good","Studying abroad is a great opportunity."],
["avoid","verb","to stay away from something or not do it","Try to avoid sugary drinks."],
["generous","adjective","happy to give more than is expected","He is very generous with his time."],
["recommend","verb","to say that something is good and worth trying","Can you recommend a good restaurant?"],
["environment","noun","the natural world, or the place where you live and work","We must protect the environment."],
["experience","noun","knowledge you get from doing something","She has a lot of experience in teaching."],
["suggest","verb","to give an idea or plan for someone to consider","I suggest taking an earlier train."],
["challenge","noun","something difficult that tests your ability","Learning a language is a big challenge."],
["require","verb","to need something or make it necessary","This job will require good English."]],
b2:[
["ambiguous","adjective","open to more than one meaning; unclear","The ending of the film was deliberately ambiguous."],
["reluctant","adjective","unwilling and hesitant to do something","She was reluctant to share her opinion."],
["inevitable","adjective","certain to happen; impossible to avoid","With prices rising, change was inevitable."],
["thorough","adjective","complete and careful, with attention to detail","The teacher gave a thorough explanation."],
["adequate","adjective","enough, or good enough for a purpose","The room was small but adequate."],
["outcome","noun","the final result of an action or process","We are waiting for the outcome of the exam."],
["considerable","adjective","fairly large in size, amount, or importance","He spent a considerable amount of money on the trip."],
["establish","verb","to set up, or to show that something is true","The school was established in 1990."],
["assume","verb","to accept that something is true without proof","I assume you have already eaten."],
["consequence","noun","a result of an action, often a bad one","Missing deadlines has serious consequences."],
["emerge","verb","to come out, or to become known","New problems began to emerge."],
["significant","adjective","important or large enough to be noticed","There was a significant improvement in her score."],
["overcome","verb","to succeed in dealing with a difficulty","He worked hard to overcome his fear of speaking."],
["tend to","phrase","to usually do or be a certain way","Students tend to forget new words quickly."],
["appropriate","adjective","suitable or right for a situation","Is this dress appropriate for the interview?"],
["reliable","adjective","able to be trusted to work or act well","My car is old but reliable."],
["efficient","adjective","working well without wasting time or energy","This is a more efficient way to study."],
["tolerate","verb","to accept something unpleasant without complaining","I can’t tolerate loud music at night."],
["contribute","verb","to give something to help achieve a result","Everyone should contribute to the project."],
["tackle","verb","to try to deal with a problem or task","The city must tackle air pollution."],
["cautious","adjective","careful to avoid danger or mistakes","Be cautious when you cross this road."],
["rely on","phrase","to depend on someone or something","You can rely on me to be on time."],
["fulfil","verb","to do or achieve what is required or hoped for","She worked hard to fulfil her dream."],
["distinguish","verb","to see or understand the difference between things","Can you distinguish between these two sounds?"],
["convince","verb","to make someone believe that something is true","He tried to convince me to join the team."],
["acquire","verb","to get or gain something, often by effort","She acquired a lot of skills at her first job."],
["dismiss","verb","to decide that something is not worth considering","They dismiss the idea too quickly."],
["undermine","verb","to weaken something gradually","Constant criticism can undermine confidence."],
["sufficient","adjective","as much as is needed; enough","We don’t have sufficient time to finish."],
["obvious","adjective","easy to see or understand","The answer was obvious to everyone."]],
c1:[
["meticulous","adjective","very careful and precise about small details","She kept meticulous records of every lesson."],
["pragmatic","adjective","dealing with things in a practical, realistic way","We need a pragmatic solution, not a perfect one."],
["scrutinize","verb","to examine something very closely","Journalists scrutinize every public statement."],
["inherent","adjective","existing as a natural, permanent part of something","There are risks inherent in any investment."],
["mitigate","verb","to make something less harmful or severe","Trees help mitigate the effects of heat."],
["profound","adjective","very deep or strong; having great effect","The book had a profound influence on me."],
["substantiate","verb","to give evidence that proves a claim","You need data to substantiate your argument."],
["resilient","adjective","able to recover quickly after difficulties","Children are often remarkably resilient."],
["exacerbate","verb","to make a bad situation worse","Stress can exacerbate health problems."],
["coherent","adjective","logical, clear, and easy to follow","Her essay was clear and coherent."]]
};
var NAMES={a2:"A2",b1:"B1",b2:"B2",c1:"C1"};
var K={};try{K=JSON.parse(localStorage.getItem("vtk")||"{}")}catch(e){}
function save(){try{localStorage.setItem("vtk",JSON.stringify(K))}catch(e){}}
var h=(location.hash||"").slice(1);
var S={lvl:D[h]?h:"b2",mode:"learn",i:0,flip:false,t:null};
function $(s){return document.querySelector(s)}
function kk(w){return S.lvl+":"+w[0]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function nKnown(){return D[S.lvl].filter(function(w){return K[kk(w)]}).length}
function blank(w){var r=new RegExp(w[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i");return r.test(w[3])?w[3].replace(r,"_____"):""}

function head(){
  $("#lv").innerHTML=Object.keys(D).map(function(k){return '<button class="'+(k===S.lvl?"on":"")+'" onclick="setLvl(\''+k+'\')">'+NAMES[k]+'</button>'}).join("");
  var m={learn:"Learn",quiz:"Quiz",spell:"Spell"};
  $("#md").innerHTML=Object.keys(m).map(function(k){return '<button class="'+(k===S.mode?"on":"")+'" onclick="setMode(\''+k+'\')">'+m[k]+'</button>'}).join("");
}
function setLvl(l){S.lvl=l;S.i=0;S.flip=false;S.t=null;try{location.hash=l}catch(e){}render()}
function setMode(m){S.mode=m;S.i=0;S.flip=false;S.t=null;render()}
function resetLvl(){if(!confirm("Clear saved progress for "+NAMES[S.lvl]+"?"))return;D[S.lvl].forEach(function(w){delete K[kk(w)]});save();S.t=null;render()}

function render(){head();(S.mode==="learn"?learn:S.mode==="quiz"?quiz:spell)()}

function progress(){var n=D[S.lvl].length,k=nKnown();return '<div class="bar"><i style="width:'+(k/n*100)+'%"></i></div><div class="meta"><span>'+NAMES[S.lvl]+' · '+k+' of '+n+' words known</span><span id="pos"></span></div>'}

/* LEARN */
function learn(){
  var L=D[S.lvl],w=L[S.i];
  var front='<p class="word">'+w[0]+'</p><p class="pos">'+w[1]+'</p><p class="hint">Tap to see the meaning</p>';
  var back='<p class="word"><mark>'+w[0]+'</mark></p><p class="pos">'+w[1]+'</p><p class="def">'+w[2]+'</p><p class="ex">“'+w[3]+'”</p>';
  $("#app").innerHTML=progress()+'<div class="card" tabindex="0" role="button" onclick="flip()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();flip()}">'+(S.flip?back:front)+'</div>'+
  '<div class="acts"><button onclick="step(-1)" aria-label="Previous word">Back</button><button onclick="mark(false)">Still learning</button><button class="pri" onclick="mark(true)">I know it</button></div>';
  $("#pos").textContent="Word "+(S.i+1)+" of "+L.length+(K[kk(w)]?" · known":"");
}
function flip(){S.flip=!S.flip;learn()}
function step(d){var n=D[S.lvl].length;S.i=(S.i+d+n)%n;S.flip=false;learn()}
function mark(v){var w=D[S.lvl][S.i];if(v)K[kk(w)]=1;else delete K[kk(w)];save();step(1)}

/* QUIZ */
function newRun(type){
  var items=shuffle(D[S.lvl]).slice(0,10);
  S.t={type:type,items:items,n:0,score:0,picked:null,fb:null,missed:[],opts:null};
}
function quiz(){
  if(!S.t||S.t.type!=="quiz")newRun("quiz");
  var t=S.t;
  if(t.n>=t.items.length)return finish();
  var w=t.items[t.n];
  if(!t.opts){var others=shuffle(D[S.lvl].filter(function(x){return x!==w})).slice(0,3);t.opts=shuffle([w].concat(others))}
  var o=t.opts.map(function(x,i){
    var c="opt";if(t.picked!==null){if(x===w)c+=" right";else if(i===t.picked)c+=" wrong"}
    return '<button class="'+c+'" '+(t.picked!==null?"disabled":"")+' onclick="pick('+i+')">'+x[2]+'</button>'}).join("");
  var fb=t.picked!==null?'<div class="fb '+(t.opts[t.picked]===w?"ok":"no")+'">'+(t.opts[t.picked]===w?"Correct. ":"Not quite. ")+'<i>“'+w[3]+'”</i></div><div class="acts"><button class="pri" onclick="nextQ()">'+(t.n+1>=t.items.length?"See my score":"Next word")+'</button></div>':"";
  $("#app").innerHTML=progress()+'<div class="q"><p class="pos">What does this mean?</p><p class="word">'+w[0]+'</p></div>'+o+fb;
  $("#pos").textContent="Question "+(t.n+1)+" of "+t.items.length;
}
function pick(i){var t=S.t,w=t.items[t.n];t.picked=i;if(t.opts[i]===w){t.score++;K[kk(w)]=1;save()}else t.missed.push(w);quiz()}
function nextQ(){S.t.n++;S.t.picked=null;S.t.opts=null;quiz()}

/* SPELL */
function spell(){
  if(!S.t||S.t.type!=="spell")newRun("spell");
  var t=S.t;
  if(t.n>=t.items.length)return finish();
  var w=t.items[t.n],b=blank(w);
  var inp=t.fb===null?'<input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type the word" placeholder="Type the word"><div class="acts"><button onclick="hint()">Show first letter</button><button class="pri" onclick="check()">Check</button></div>':
    '<div class="fb '+(t.fb?"ok":"no")+'">'+(t.fb?"Correct: ":"The word is: ")+'<b>'+w[0]+'</b></div><div class="acts"><button class="pri" onclick="nextS()">'+(t.n+1>=t.items.length?"See my score":"Next word")+'</button></div>';
  $("#app").innerHTML=progress()+'<div class="q"><p class="pos">'+w[1]+' · '+w[0].length+' letters</p><p class="def">'+w[2]+'</p>'+(b?'<p class="ex">“'+b+'”</p>':"")+inp+'</div>';
  $("#pos").textContent="Question "+(t.n+1)+" of "+t.items.length;
  var a=$("#ans");if(a){a.focus();a.addEventListener("keydown",function(e){if(e.key==="Enter")check()})}
}
function hint(){var a=$("#ans"),w=S.t.items[S.t.n];if(a){a.value=w[0][0];a.focus()}}
function check(){var a=$("#ans"),t=S.t,w=t.items[t.n];var ok=a.value.trim().toLowerCase()===w[0].toLowerCase();t.fb=ok;if(ok){t.score++;K[kk(w)]=1;save()}else t.missed.push(w);spell()}
function nextS(){S.t.n++;S.t.fb=null;spell()}

/* RESULTS */
function finish(){
  var t=S.t,n=t.items.length,pct=Math.round(t.score/n*100);
  var msg=pct>=80?"Great work.":pct>=50?"Good start. Review the missed words and try again.":"Go back to Learn mode, then try again.";
  var miss=t.missed.length?'<ul class="miss">'+t.missed.map(function(w){return '<li><b>'+w[0]+'</b> – '+w[2]+'</li>'}).join("")+'</ul>':"";
  $("#app").innerHTML=progress()+'<div class="q" style="text-align:center"><p class="pos">'+(t.type==="quiz"?"Quiz":"Spelling")+' result · '+NAMES[S.lvl]+'</p><p class="score">'+t.score+' / '+n+'</p><p>'+msg+'</p>'+miss+'<div class="acts"><button onclick="setMode(\'learn\')">Review words</button><button class="pri" onclick="S.t=null;render()">Try again</button></div></div>';
  $("#pos").textContent="Finished";
}
render();
</script>
</body>
</html>
